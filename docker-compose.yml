# The "version" tag is no longer needed in modern Docker Compose
# version: '3.8' 

services:
  # Zookeeper: A mandatory dependency for Kafka to manage its state
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka: Our high-performance, event-driven message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      # Expose Kafka's port to our local machine so our services can connect
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Kafka UI: A web interface to visually manage topics and messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      
  # MinIO: Our local, S3-compatible object storage for vehicle images
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"  # API Port for our services to connect to
      - "9001:9001"  # Web Console Port for us to manage buckets
    volumes:
      # Persist data so we don't lose images on restart
      - minio_data:/data
    environment:
      # These are the credentials our Python service will use
      MINIO_ROOT_USER: minioadmin 
      MINIO_ROOT_PASSWORD: minioadmin
    # Command to start the MinIO server
    command: server /data --console-address ":9001"

# Define the volume for MinIO to persist its data
volumes:
  minio_data:

